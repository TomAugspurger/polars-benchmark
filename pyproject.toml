[project]
name = "polars-benchmark"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linetimer>=0.1.5",
    "polars>=1.21.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
]

polars = [
    "polars==1.24.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "W", # pycodestyle
  "F", # Pyflakes
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D", # flake8-docstrings
  "D212", # Augment NumPy docstring convention: Multi-line docstring summary should start at the second line
  "D417", # Augment NumPy docstring convention: Missing argument descriptions
  "I", # isort
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "RUF", # Ruff-specific rules
  "PTH", # flake8-use-pathlib
  "FA", # flake8-future-annotations
  "PIE", # flake8-pie
  "TD", # flake8-todos
  "TRY", # tryceratops
  "EM", # flake8-errmsg
]

ignore = [
  # Line length regulated by formatter
  "E501",
  # pydocstyle: http://www.pydocstyle.org/en/stable/error_codes.html
  "D1", # Missing docstring
  # flake8-simplify
  "SIM102", # Use a single `if` statement instead of nested `if` statements
  "SIM108", # Use ternary operator
  # ruff
  "RUF005", # unpack-instead-of-concatenating-to-collection-literal
  # flake8-todos
  "TD002", # Missing author in TODO
  "TD003", # Missing issue link on the line following this TODO
  # tryceratops
  "TRY003", # Avoid specifying long messages outside the exception class
  # Lints below are turned off because of conflicts with the ruff formatter
  "D206",
  "W191",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["queries", "scripts"]
strict = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "ignore-without-code",
]
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = [
  "linetimer.*",
  "modin.*",
  "plotly.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "plotnine.*",
]
follow_imports = "skip"

[[tool.uv.index]]
name = "rapidsai-wheels-nightly"
url = "https://pypi.anaconda.org/rapidsai-wheels-nightly/simple"

[dependency-groups]
gpu = [
    "cudf-polars-cu12>=25.2.2",
    "dask-cuda>=25.2.0",
    "packaging>=24.2",
    "polars[gpu]>=1.21.0",
    "rmm-cu12>=25.2.0",
    "ucx-py-cu12>=0.42.0",
]

[tool.uv.sources]
cudf-polars-cu12 = { git = "https://github.com/rjzamora/cudf.git", rev = "81d225799849e4739108bb61fcadd50bcaf3b903", subdirectory = "python/cudf_polars"}
pylibcudf = { index = "rapidsai-wheels-nightly" }
libcudf = { index = "rapidsai-wheels-nightly" }
rmm-cu12 = { index = "rapidsai-wheels-nightly" }

[tool.uv]
override-dependencies = [
  "libcudf-cu12==25.4.0a329",
  "pylibcudf-cu12==25.4.0a329",
  "rmm-cu12==25.4.0a44",
  "librmm-cu12==25.4.0a44",
]

[tool.uv.pip]
prerelease = "allow"